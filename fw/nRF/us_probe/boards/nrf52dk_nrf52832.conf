# Board-specific configuration
# Enable the nrfx SPIM driver. Instances are selected from devicetree.
CONFIG_NRFX_SPIM=y

# Enable PPI (Programmable Peripheral Interconnect)
CONFIG_NRFX_PPI=y

CONFIG_BT_MESH=n
CONFIG_BT_EXT_ADV=n
CONFIG_BT_MAX_CONN=1
CONFIG_BT_ID_MAX=2
CONFIG_BT_EXT_ADV_MAX_ADV_SET=1
