# Enable BT
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="WULPUS Simple"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y

# Enable BT Mesh
CONFIG_BT_MESH=y
CONFIG_BT_MESH_RELAY=y
CONFIG_BT_MESH_PB_GATT=y
CONFIG_BT_MESH_PB_ADV=y
CONFIG_BT_MESH_DK_PROV=y
CONFIG_BT_MESH_GATT_PROXY=n
CONFIG_BT_MESH_FRIEND=n
# Buffer sizes
CONFIG_BT_MESH_TX_SEG_MAX=32
# CONFIG_BT_MESH_TX_SEG_MSG_COUNT=30
CONFIG_BT_MESH_RX_SEG_MAX=32
# CONFIG_BT_MESH_RX_SEG_MSG_COUNT=30
# CONFIG_BT_MESH_ADV_BUF_COUNT=256
# Decrease retransmit attempts to reduce congestion
CONFIG_BT_MESH_NETWORK_TRANSMIT_COUNT=1
# Persistent 
# persistent storage for BT Mesh
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Allow self-provisioning
CONFIG_BT_MESH_CFG_CLI=y
# (Enable Hardware Info for Bluetooth ID)
CONFIG_HWINFO=y


# Enable GPIO
CONFIG_GPIO=y

# Log to RTT
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_PRINTK=y
CONFIG_RTT_CONSOLE=y

# Memory
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
