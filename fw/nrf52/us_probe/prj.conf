# Enable BT
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="WULPUS unprovisioned"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_NUS=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_CTLR_PRIVACY=n
# Enable storing settings in flash
# CONFIG_SECURE_STORAGE=y
# CONFIG_BT_SETTINGS=y
# CONFIG_FLASH=y
# CONFIG_FLASH_PAGE_LAYOUT=y
# CONFIG_FLASH_MAP=y
# CONFIG_ZMS=y
# CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
# Optimizing for high throughput
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=10
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_ATT_PREPARE_COUNT=5
# Enable longer BT messages
CONFIG_BT_L2CAP_TX_MTU=220
CONFIG_BT_BUF_ACL_TX_SIZE=224
CONFIG_BT_BUF_ACL_RX_SIZE=230
CONFIG_BT_CTLR_DATA_LENGTH_MAX=211

# Enable BT Mesh
CONFIG_BT_MESH=y
CONFIG_BT_MESH_MODEL_EXTENSIONS=y
CONFIG_BT_MESH_RELAY=y
CONFIG_BT_MESH_FRIEND=y
CONFIG_BT_MESH_PB_GATT=y
CONFIG_BT_MESH_PB_ADV=y
CONFIG_BT_MESH_GATT_PROXY=y
CONFIG_BT_MESH_PROXY_USE_DEVICE_NAME=n
CONFIG_BT_MESH_TX_SEG_MAX=32
CONFIG_BT_MESH_DEFAULT_TTL=7
CONFIG_BT_MESH_DK_PROV=y
# Allos self-provisioning
CONFIG_BT_MESH_CFG_CLI=y
CONFIG_BT_MESH_TX_SEG_MAX=32
CONFIG_BT_MESH_TX_SEG_MSG_COUNT=5
CONFIG_BT_MESH_RX_SEG_MAX=32
CONFIG_BT_MESH_RX_SEG_MSG_COUNT=5
CONFIG_BT_MESH_ADV_BUF_COUNT=256
# Increase retransmission attempts (modern SAR configuration)
CONFIG_BT_MESH_SAR_TX_UNICAST_RETRANS_WITHOUT_PROG_COUNT=0x0A
CONFIG_BT_MESH_SAR_TX_UNICAST_RETRANS_COUNT=0x07
CONFIG_BT_MESH_NETWORK_TRANSMIT_COUNT=3
# Increase (system workqueue) stack for BLE Mesh
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_MESH_ADV_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
# Allow parallel GATT and Mesh
CONFIG_BT_EXT_ADV=y
CONFIG_BT_MAX_CONN=3
CONFIG_BT_ID_MAX=2
# (5 sets are used by Bluetooth Mesh, 1 is needed for the GATT advertisement)
CONFIG_BT_EXT_ADV_MAX_ADV_SET=6 
# (Enable Hardware Info for Bluetooth ID)
CONFIG_HWINFO=y


# Enable GPIO
CONFIG_GPIO=y

# Log to RTT
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_RTT_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096


# Enable Asserts
CONFIG_ASSERT=y

# Memory optimization
# CONFIG_MAIN_STACK_SIZE=512
# CONFIG_IDLE_STACK_SIZE=256   